name: Refresh market data and deploy Pages
on:
  workflow_dispatch:
  schedule:
    # 09:17 UTC = 18:17 Korea time, Monday–Friday; exchange data may publish later.
    - cron: '17 9 * * 1-5'
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt
      - run: python -m pip install -r requirements.txt
      - name: Retrieve market series
        run: python src/update_markets.py
      - name: Build static artifact
        run: |
          mkdir -p site/data
          cp index.html site/index.html
          cp data/markets.json site/data/markets.json
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - uses: actions/deploy-pages@v4
        id: deployment
